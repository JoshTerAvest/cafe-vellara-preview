<!DOCTYPE html><html lang="en"><head><meta charSet="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><link rel="stylesheet" href="./_next/static/css/ff2ee4024360e168.css" data-precedence="next"/><link rel="preload" as="script" fetchPriority="low" href="./_next/static/chunks/webpack-aefcfdc45265db7c.js"/><script src="./_next/static/chunks/fd9d1056-f34d2e789b461d77.js" async=""></script><script src="./_next/static/chunks/117-4b6a8fa4c4cf52b5.js" async=""></script><script src="./_next/static/chunks/main-app-395de5ab803d2a2a.js" async=""></script><script src="./_next/static/chunks/883-c687ce999b2c8454.js" async=""></script><script src="./_next/static/chunks/app/page-d9122d126df3ea77.js" async=""></script><meta name="theme-color" content="#0d0705"/><title>Café Vellara</title><meta name="description" content="The last warm room before Olympus."/><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=&#x27;http://www.w3.org/2000/svg&#x27; viewBox=&#x27;0 0 16 16&#x27;%3E%3Ccircle cx=&#x27;8&#x27; cy=&#x27;8&#x27; r=&#x27;6&#x27; fill=&#x27;%23ff9a3c&#x27;/%3E%3C/svg%3E"/><script src="./_next/static/chunks/polyfills-42372ed130431b0a.js" noModule=""></script></head><body class="bg-roast-deep text-cream antialiased"><main class="fixed inset-0 mx-auto w-full max-w-[430px] overflow-hidden"><div class="relative h-full w-full overflow-hidden"><div class="cv-scene relative h-full w-full select-none overflow-hidden bg-[#0d0705]" data-treatment="amber"><style>
.cv-scene { -webkit-tap-highlight-color: transparent; }

/* CRT memory — amber treatment only, opacity stays under 0.05 */
.cv-scanlines {
  background: repeating-linear-gradient(to bottom,
    rgba(255,183,102,0.05) 0px, rgba(255,183,102,0.05) 1px,
    rgba(0,0,0,0) 1px, rgba(0,0,0,0) 3px);
  mix-blend-mode: screen;
}

/* svg transform plumbing */
.cv-flame-a, .cv-flame-b, .cv-steam {
  transform-box: fill-box; transform-origin: 50% 100%;
}
.cv-halo, .cv-glint, .cv-seam {
  transform-box: fill-box; transform-origin: 50% 50%;
}

/* ── candle fire — three layered, phase-shifted motions ────────────── */
.cv-flame-a { animation: cv-flick-a 2.3s ease-in-out infinite; }
.cv-flame-b { animation: cv-flick-b 1.45s ease-in-out infinite; }
.cv-halo    { animation: cv-halo-k 2.9s ease-in-out infinite; }
@keyframes cv-flick-a {
  0%, 100% { transform: scale(1, 1); }
  13%      { transform: scale(0.98, 1.04); }
  23%      { transform: scale(1.02, 0.95) translateX(0.08px); }
  36%      { transform: scale(0.99, 1.02); }
  49%      { transform: scale(1.01, 0.96) translateX(-0.07px); }
  62%      { transform: scale(0.97, 1.05); }
  74%      { transform: scale(1.02, 0.96); }
  88%      { transform: scale(0.99, 1.01) translateX(0.05px); }
}
@keyframes cv-flick-b {
  0%, 100% { opacity: 0.95; }
  11% { opacity: 0.78; }
  27% { opacity: 1; }
  41% { opacity: 0.72; }
  58% { opacity: 0.94; }
  73% { opacity: 0.8; }
  86% { opacity: 1; }
}
@keyframes cv-halo-k {
  0%, 100% { opacity: 0.75; transform: scale(1); }
  19% { opacity: 0.58; transform: scale(0.96); }
  43% { opacity: 0.85; transform: scale(1.05); }
  61% { opacity: 0.6;  transform: scale(0.97); }
  82% { opacity: 0.8;  transform: scale(1.03); }
}

/* ── the storm outside the viewport ─────────────────────────────────── */
.cv-dust-a { animation: cv-dust-w 36s linear infinite; }
.cv-dust-b { animation: cv-dust-w 22s linear infinite; }
.cv-dust-c { animation: cv-dust-w 13s linear infinite; }
@keyframes cv-dust-w { to { transform: translateX(-24px); } }

/* settlement beacon — green, slow, 8 second cycle (Mars Trail canon) */
.cv-beacon { animation: cv-beacon-k 8s linear infinite; }
@keyframes cv-beacon-k {
  0%, 100% { opacity: 0; }
  1.5% { opacity: 1; }
  4.5% { opacity: 0.8; }
  7%   { opacity: 0; }
}

/* ── coffee apparatus steam — an occasional, unhurried puff ─────────── */
.cv-steam { animation: cv-steam-k 9s ease-out infinite; }
@keyframes cv-steam-k {
  0%  { opacity: 0;    transform: translateY(0) scale(0.5); }
  6%  { opacity: 0.55; }
  16% { opacity: 0.28; transform: translateY(-6px) scale(1.15); }
  26% { opacity: 0;    transform: translateY(-10px) scale(1.4); }
  100% { opacity: 0;   transform: translateY(-10px) scale(1.4); }
}

/* ── the music box's dull glint — rare, almost shy ──────────────────── */
.cv-glint { animation: cv-glint-k 7.5s ease-in-out infinite; }
@keyframes cv-glint-k {
  0%, 84%, 100% { opacity: 0;    transform: scale(0.4) rotate(0deg); }
  90%           { opacity: 0.55; transform: scale(1) rotate(18deg); }
  96%           { opacity: 0;    transform: scale(0.5) rotate(32deg); }
}

/* ── hotspot idle shimmer — a glint, not a button ───────────────────── */
.cv-shimmer {
  position: absolute; inset: 0; pointer-events: none; opacity: 0;
  border-radius: 9999px; mix-blend-mode: screen;
  background: radial-gradient(ellipse at 50% 50%,
    rgba(255,221,160,0.3) 0%, rgba(255,183,102,0.12) 45%, rgba(255,183,102,0) 70%);
  animation: cv-shimmer-k 6s ease-in-out infinite;
}
@keyframes cv-shimmer-k {
  0%, 80%, 100% { opacity: 0;    transform: scale(0.92); }
  87%           { opacity: 0.45; transform: scale(1); }
  93%           { opacity: 0.12; }
}

/* ── threshold: arrival through the airlock ─────────────────────────── */
.cv-dust-th-a { animation: cv-dust-th 30s linear infinite; }
.cv-dust-th-b { animation: cv-dust-th 17s linear infinite; }
@keyframes cv-dust-th { to { transform: translateX(-100px); } }

.cv-wind { animation: cv-wind-k 3.4s linear infinite; }
@keyframes cv-wind-k {
  0%   { transform: translateX(0); opacity: 0; }
  10%  { opacity: 0.25; }
  40%  { opacity: 0.12; }
  55%  { transform: translateX(150px); opacity: 0; }
  100% { transform: translateX(150px); opacity: 0; }
}

.cv-shake { animation: cv-shake-k 0.55s linear 2; }
@keyframes cv-shake-k {
  0%, 100% { transform: translate(0, 0); }
  20% { transform: translate(0.5%, -0.3%); }
  40% { transform: translate(-0.45%, 0.3%); }
  60% { transform: translate(0.35%, 0.2%); }
  80% { transform: translate(-0.3%, -0.15%); }
}

.cv-seam { transform: scaleY(0.02); opacity: 0; }
.cv-cycling .cv-seam { animation: cv-seam-k 1.9s cubic-bezier(0.2, 0.7, 0.25, 1) forwards; }
@keyframes cv-seam-k {
  0%  { transform: scaleY(0.02); opacity: 0; }
  14% { transform: scaleY(0.12); opacity: 0.65; }
  60% { transform: scaleY(1); opacity: 0.95; }
  100% { transform: scaleY(1); opacity: 1; }
}

.cv-warmflash {
  background: radial-gradient(circle at 6% 58%,
    rgba(255,183,102,0.5) 0%, rgba(255,154,60,0.16) 30%, rgba(255,154,60,0) 60%);
  animation: cv-warm-k 2.5s ease-out forwards;
}
@keyframes cv-warm-k { 0% { opacity: 0; } 30% { opacity: 1; } 100% { opacity: 0; } }

.cv-fadeveil { animation: cv-fadeveil-k 1s ease forwards; }
@keyframes cv-fadeveil-k { from { opacity: 1; } to { opacity: 0; } }

/* ── reduced motion: hold the room still, keep it legible ───────────── */
@media (prefers-reduced-motion: reduce) {
  .cv-flame-a, .cv-flame-b, .cv-halo,
  .cv-dust-a, .cv-dust-b, .cv-dust-c,
  .cv-dust-th-a, .cv-dust-th-b,
  .cv-steam, .cv-beacon, .cv-glint, .cv-wind, .cv-shake {
    animation: none !important;
  }
  .cv-steam { opacity: 0; }
  .cv-beacon { opacity: 0.6; }
  .cv-shimmer { animation: none !important; opacity: 0.12; transform: none; }
}
